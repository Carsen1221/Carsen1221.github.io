<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tap the Bowl</title>
<link href="https://fonts.googleapis.com/css2?family=Boogaloo&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: #D32B2B;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    font-family: 'Boogaloo', cursive;
    overflow: hidden;
    position: relative;
  }

  .title {
    color: white;
    font-size: clamp(3rem, 16vw, 6rem);
    text-align: center;
    line-height: 1;
    letter-spacing: 0.05em;
    padding: 2rem 1rem 0;
    text-transform: uppercase;
    user-select: none;
  }

  .bowl-wrapper {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    cursor: pointer;
    padding: 0 1rem;
  }

  .bowl-img {
    width: min(85vw, 420px);
    transition: transform 0.12s ease;
    filter: drop-shadow(0 0 0px transparent);
  }

  .bowl-img:active {
    transform: scale(0.94);
  }

  .bowl-img.shake {
    animation: shake 0.45s ease;
  }

  @keyframes shake {
    0%   { transform: rotate(0deg) scale(1); }
    15%  { transform: rotate(-6deg) scale(1.04); }
    30%  { transform: rotate(6deg) scale(1.04); }
    45%  { transform: rotate(-4deg) scale(1.02); }
    60%  { transform: rotate(4deg) scale(1.02); }
    75%  { transform: rotate(-2deg) scale(1.01); }
    100% { transform: rotate(0deg) scale(1); }
  }

  .card {
    width: calc(100% - 2rem);
    max-width: 420px;
    margin: 0 1rem 2rem;
    background: white;
    border-radius: 16px;
    padding: 1.2rem 1.5rem;
    text-align: center;
    min-height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
  }

  .card-text {
    font-family: 'Courier New', monospace;
    font-size: clamp(0.95rem, 3.5vw, 1.1rem);
    font-weight: 700;
    color: #111;
    line-height: 1.5;
    opacity: 1;
    transition: opacity 0.2s ease;
  }

  .card-text.fade {
    opacity: 0;
  }

  .card-text.hint {
    color: #888;
    font-weight: 400;
    font-style: italic;
  }
</style>
</head>

<div class="card">
  <div class="card-text hint" id="cardText">Tap the bowl to reveal your fortune...</div>
</div>

<script>
const fortunes = [
  "In a week you will have the opportunity to perform. It is important you learn a niche talent NOW.",
  "You will see a pole when it is too late.",
  "Tighten your lug nuts.",
  "Someone will see those big ass toes. Keep your socks on tonight.",
  "The children see through your lies. Be more honest.",
  "Stop walking over pennies. You'll need them.",
  "Read every word on the next terms and conditions you sign.",
];

let lastIndex = -1;

function getFortune() {
  let idx;
  do { idx = Math.floor(Math.random() * fortunes.length); } while (idx === lastIndex && fortunes.length > 1);
  lastIndex = idx;
  return fortunes[idx];
}

const bowlBtn = document.getElementById('bowlBtn');
const bowlImg = document.getElementById('bowlImg');
const cardText = document.getElementById('cardText');
let animating = false;

bowlBtn.addEventListener('click', () => {
  if (animating) return;
  animating = true;

  bowlImg.classList.add('shake');
  cardText.classList.add('fade');

  setTimeout(() => {
    cardText.textContent = getFortune();
    cardText.classList.remove('hint');
    cardText.classList.remove('fade');
  }, 220);

  bowlImg.addEventListener('animationend', () => {
    bowlImg.classList.remove('shake');
    animating = false;
  }, { once: true });
});
</script>
